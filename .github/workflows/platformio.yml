name: PlatformIO build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee platformio-build.log
      - name: Build LittleFS image
        shell: bash
        run: |
          set -o pipefail
          pio run -t buildfs 2>&1 | tee platformio-buildfs.log
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-logs
          path: |
            platformio-build.log
            platformio-buildfs.log
          if-no-files-found: ignore
